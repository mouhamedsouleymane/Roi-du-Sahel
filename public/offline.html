<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne — Les Rois du Sahel</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, #2e1065, #0f172a, #2e1065);
            color: #f1f5f9; padding: 1.5rem; text-align: center;
        }
        .card {
            background: rgba(46, 16, 101, .8); border: 1px solid rgba(147, 51, 234, .4);
            border-radius: 1.5rem; padding: 2.5rem 2rem; max-width: 26rem; width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .5);
        }
        .logo { width: 5rem; height: 5rem; border-radius: 9999px; object-fit: cover;
            border: 4px solid rgba(251, 191, 36, .4); margin-bottom: 1rem; background: #fff; }
        h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: .05em; margin-bottom: .5rem; }
        p { font-size: .875rem; color: #c4b5fd; margin-bottom: 1.5rem; }
        a, button {
            display: inline-block; background: #fbbf24; color: #2e1065; font-weight: 900;
            font-size: .875rem; padding: .75rem 1.5rem; border-radius: .75rem; text-decoration: none;
            border: none; cursor: pointer;
        }
        a:hover, button:hover { background: #f59e0b; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo_roi.jpeg" alt="Logo Les Rois du Sahel" class="logo">
        <h1>📡 VOUS ÊTES HORS LIGNE</h1>
        <p>Vérifiez votre connexion internet puis réessayez. L'application Les Rois du Sahel nécessite une connexion pour accéder aux données scolaires.</p>
        <button type="button" onclick="window.location.reload()">🔄 Réessayer</button>
    </div>
</body>
</html>
