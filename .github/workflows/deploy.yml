name: CD — Déploiement Production

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI — Tests & Qualité"]
    branches: [main]
    types: [completed]

# Ne pas lancer plusieurs déploiements en parallèle
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Déployer en Production
    runs-on: ubuntu-latest
    # Ne déployer que si le CI a réussi
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      # ──────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────
      - name: Checkout du code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. Build du Frontend (Vite)
      # ──────────────────────────────────────────
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances NPM
        run: npm ci

      - name: Compiler les assets avec Vite
        run: npm run build

      # ──────────────────────────────────────────
      # 3. Installer Composer (prod uniquement)
      # ──────────────────────────────────────────
      - name: Configurer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_mysql
          coverage: none

      - name: Installer les dépendances PHP (production)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      # ──────────────────────────────────────────
      # 4. Configurer la clé SSH
      # ──────────────────────────────────────────
      - name: Configurer l'agent SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ajouter le serveur aux hôtes connus
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ──────────────────────────────────────────
      # 5. Déploiement via Deployer (zero-downtime)
      # ──────────────────────────────────────────
      - name: Déployer avec PHP Deployer
        run: |
          curl -LO https://deployer.org/deployer.phar
          chmod +x deployer.phar
          ./deployer.phar deploy production \
            --branch=${{ github.ref_name }} \
            -v
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          APP_KEY: ${{ secrets.APP_KEY_PRODUCTION }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PRODUCTION }}

      # ──────────────────────────────────────────
      # 6. Notifier en cas d'échec
      # ──────────────────────────────────────────
      - name: Notifier l'échec du déploiement
        if: failure()
        run: |
          echo "❌ Déploiement échoué sur la branche ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Auteur: ${{ github.actor }}"
          # Ajoutez ici une notification Slack/Email/SMS si nécessaire
